<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in &middot; vidwatch</title>
  <script>try{var t=localStorage.getItem('vidwatch_theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="topbar"></div>
  <main class="container-narrow">
    <div class="card-panel">
      <h1 class="form-title">Welcome back</h1>
      <p class="form-sub">Sign in to upload, like, and comment.</p>
      <div id="error" class="form-error" hidden></div>
      <form id="login-form">
        <label class="field">
          <span>Email or username</span>
          <input id="emailOrUsername" name="emailOrUsername" type="text" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
      </form>
      <p class="form-foot">Don't have an account? <a href="/register">Create one</a></p>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    if (Auth.user) location.href = '/';
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const { token, user } = await api('/api/auth/login', {
          method: 'POST',
          body: {
            emailOrUsername: form.emailOrUsername.value.trim(),
            password: form.password.value
          }
        });
        Auth.set(token, user);
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = next;
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
