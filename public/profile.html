<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile &middot; vidwatch</title>
  <script>try{var t=localStorage.getItem('vidwatch_theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="topbar"></div>
  <main class="container profile-layout">
    <div class="profile-content">
      <div id="profile"></div>
      <div class="tabs" id="tabs" hidden>
        <button class="tab active" type="button" data-tab="videos">Videos</button>
        <button class="tab" type="button" data-tab="liked">Liked videos</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
      <div class="load-more-wrap"><button id="load-more" class="btn" hidden>Load more</button></div>
    </div>
    <aside class="profile-banner" id="profile-banner" aria-hidden="true"></aside>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const username = decodeURIComponent(location.pathname.split('/').pop());
    let isSelf = false;
    let profileUser = null;
    let tab = 'videos';
    let offset = 0;

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const loadMore = document.getElementById('load-more');

    function videosUrl(off) {
      if (tab === 'liked') return `/api/users/${encodeURIComponent(username)}/liked${off ? '?offset=' + off : ''}`;
      return `/api/users/${encodeURIComponent(username)}${off ? '?offset=' + off : ''}`;
    }

    async function loadVideosPage(append) {
      try {
        const data = await api(videosUrl(append ? offset : 0));
        const videos = data.videos || [];
        if (!append) { grid.innerHTML = ''; offset = 0; }
        const visible = videos.filter(videoPassesRestriction);
        grid.insertAdjacentHTML('beforeend', visible.map(v => renderVideoCard(v, { showAuthor: tab === 'liked' })).join(''));
        offset += videos.length;
        loadMore.hidden = !data.hasMore;
        const anyShown = grid.children.length > 0;
        empty.hidden = anyShown;
        if (!anyShown) empty.textContent = tab === 'liked' ? 'No liked videos yet.' : (isSelf ? 'You haven’t uploaded anything yet.' : 'No videos yet.');
      } catch (e) { empty.hidden = false; empty.textContent = e.message; loadMore.hidden = true; }
    }

    function renderProfile(user) {
      isSelf = !!user.isSelf;
      document.title = `${user.username} — vidwatch`;
      const sub = (!isSelf && Auth.user) ? `<button class="btn ${user.subscribed ? 'btn-ghost' : 'btn-primary'}" id="sub-btn" type="button">${user.subscribed ? 'Saved' : 'Save &amp; Notify'}</button>` : '';
      const edit = isSelf ? `<button class="btn btn-ghost" id="edit-profile-btn" type="button">Edit profile</button>` : '';
      document.getElementById('profile').innerHTML = `
        <div class="profile-header">
          ${avatarFor(user, { xl: true })}
          <div class="profile-main">
            <h1 class="profile-name">${escapeHtml(user.username)}</h1>
            <div class="profile-meta">saved by ${pluralize(user.subscribers, 'viewer')} &middot; joined ${timeAgo(user.createdAt)}</div>
            ${user.bio ? `<p class="profile-bio">${escapeHtml(user.bio)}</p>` : (isSelf ? '<p class="form-sub">No bio yet.</p>' : '')}
          </div>
          <div class="profile-actions">${sub}${edit}</div>
        </div>
        <div class="edit-panel card-panel" id="edit-profile-panel" hidden></div>
      `;
      profileUser = user;
      renderBanner();

      const subBtn = document.getElementById('sub-btn');
      if (subBtn) subBtn.onclick = async () => {
        try {
          const r = await api(`/api/users/${encodeURIComponent(username)}/subscribe`, { method: 'POST' });
          subBtn.className = 'btn ' + (r.subscribed ? 'btn-ghost' : 'btn-primary');
          subBtn.textContent = r.subscribed ? 'Saved' : 'Save & Notify';
          document.querySelector('.profile-meta').textContent = `saved by ${pluralize(r.subscribers, 'viewer')} · joined ${timeAgo(user.createdAt)}`;
        } catch (e) { toast(e.message, 'error'); }
      };
      const editBtn = document.getElementById('edit-profile-btn');
      if (editBtn) editBtn.onclick = () => openEditProfile(user);

      // tabs (only meaningful for self — others don't get a liked tab)
      const tabs = document.getElementById('tabs');
      if (isSelf) {
        tabs.hidden = false;
        tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
          if (b.dataset.tab === tab) return;
          tab = b.dataset.tab;
          tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
          loadVideosPage(false);
        }));
      }
    }

    // Vertical banner rail. The owner can pick an image for it (or clear it);
    // everyone else just sees whatever they chose.
    function renderBanner() {
      const el = document.getElementById('profile-banner');
      const user = profileUser;
      el.setAttribute('aria-hidden', user.bannerUrl ? 'false' : 'true');
      const body = user.bannerUrl
        ? `<img class="banner-img" src="${encodeURI(user.bannerUrl)}" alt="${escapeHtml(user.username)} banner">`
        : `<span class="banner-empty">${isSelf ? 'Add a banner' : 'Banner'}</span>`;
      const controls = isSelf ? `
        <div class="banner-controls">
          <span class="banner-hint">Vertical image &middot; 1:4 (e.g. 400&times;1600)</span>
          <button class="btn btn-ghost" id="banner-pick" type="button">${user.bannerUrl ? 'Change' : 'Choose image'}</button>
          ${user.bannerUrl ? '<button class="btn btn-ghost" id="banner-remove" type="button">Remove</button>' : ''}
          <input id="banner-file" type="file" accept="image/*" hidden>
        </div>` : '';
      el.innerHTML = body + controls;
      if (!isSelf) return;

      const fileInput = document.getElementById('banner-file');
      document.getElementById('banner-pick').onclick = () => fileInput.click();
      fileInput.onchange = () => {
        const f = fileInput.files[0];
        if (!f) return;
        const form = new FormData();
        form.append('banner', f);
        saveBanner(form, 'Banner updated');
      };
      const removeBtn = document.getElementById('banner-remove');
      if (removeBtn) removeBtn.onclick = () => {
        const form = new FormData();
        form.append('removeBanner', 'true');
        saveBanner(form, 'Banner removed');
      };
    }

    async function saveBanner(form, okMessage) {
      try {
        const r = await api('/api/users/me', { method: 'PATCH', form });
        Auth.setUser(r.user);
        profileUser.bannerUrl = r.user.bannerUrl;
        renderBanner();
        toast(okMessage);
      } catch (e) { toast(e.message, 'error'); }
    }

    function openEditProfile(user) {
      const panel = document.getElementById('edit-profile-panel');
      panel.hidden = false;
      panel.innerHTML = `
        <h3>Edit profile</h3>
        <div id="ep-error" class="form-error" hidden></div>
        <label class="field"><span>Bio</span><textarea id="ep-bio" maxlength="500">${escapeHtml(user.bio || '')}</textarea></label>
        <label class="field"><span>Profile picture (optional)</span><input id="ep-avatar" type="file" accept="image/*"></label>
        <div class="btn-row"><button class="btn btn-primary" id="ep-save" type="button">Save</button><button class="btn btn-ghost" id="ep-cancel" type="button">Cancel</button></div>
      `;
      document.getElementById('ep-cancel').onclick = () => { panel.hidden = true; };
      document.getElementById('ep-save').onclick = async () => {
        const f = new FormData();
        f.append('bio', document.getElementById('ep-bio').value.trim());
        const af = document.getElementById('ep-avatar').files[0];
        if (af) f.append('avatar', af);
        try {
          const r = await api('/api/users/me', { method: 'PATCH', form: f });
          Auth.setUser(r.user);
          panel.hidden = true;
          // refresh the page data so the new bio/avatar shows
          location.reload();
        } catch (e) { const er = document.getElementById('ep-error'); er.textContent = e.message; er.hidden = false; }
      };
    }

    loadMore.addEventListener('click', () => loadVideosPage(true));

    (async function () {
      try {
        const data = await api(`/api/users/${encodeURIComponent(username)}`);
        renderProfile(data.user);
        // first page already came back with the profile fetch
        const visible = (data.videos || []).filter(videoPassesRestriction);
        grid.innerHTML = visible.map(v => renderVideoCard(v)).join('');
        offset = (data.videos || []).length;
        loadMore.hidden = !data.hasMore;
        if (!grid.children.length) { empty.hidden = false; empty.textContent = isSelf ? 'You haven’t uploaded anything yet.' : 'No videos yet.'; }
      } catch (e) {
        const main = document.querySelector('main');
        main.classList.remove('profile-layout');
        main.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
