<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playlist &middot; vidwatch</title>
  <script>try{var t=localStorage.getItem('vidwatch_theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="topbar"></div>
  <main class="container">
    <div id="header"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const listId = new URLSearchParams(location.search).get('list');
    if (!listId) location.href = '/library';

    const header = document.getElementById('header');
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    async function load() {
      try {
        const { playlist, items } = await api(`/api/playlists/${encodeURIComponent(listId)}`);
        document.title = `${playlist.title} — vidwatch`;
        const visible = items.filter(videoPassesRestriction);
        header.innerHTML = `
          <div class="playlist-header">
            <div>
              <h1 class="page-title">${escapeHtml(playlist.title)}</h1>
              <div class="form-sub">${pluralize(items.length, 'video')} &middot; by <a href="/u/${encodeURIComponent(playlist.owner.username)}">${escapeHtml(playlist.owner.username)}</a></div>
            </div>
            <div class="btn-row">
              ${visible.length ? `<a class="btn btn-primary" href="/watch?v=${encodeURIComponent(visible[0].id)}&list=${encodeURIComponent(playlist.id)}">Play all</a>` : ''}
            </div>
          </div>`;
        if (!visible.length) { empty.hidden = false; empty.textContent = 'This playlist is empty.'; return; }
        grid.innerHTML = visible.map((v, i) => renderVideoCard(v, {
          extraActions: playlist.isOwner ? `<button class="card-btn" type="button" data-rm="${escapeHtml(v.id)}">Remove</button>` : ''
        })).join('');
        if (playlist.isOwner) {
          grid.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async (e) => {
            e.preventDefault();
            try { await api(`/api/playlists/${encodeURIComponent(listId)}/items/${encodeURIComponent(b.dataset.rm)}`, { method: 'DELETE' }); load(); }
            catch (err) { toast(err.message, 'error'); }
          }));
        }
        // make every card carry the &list= param so playback auto-advances within the playlist
        grid.querySelectorAll('.card-link').forEach(a => {
          const u = new URL(a.href, location.origin);
          u.searchParams.set('list', playlist.id);
          a.href = u.pathname + u.search;
        });
      } catch (e) {
        header.innerHTML = '';
        empty.hidden = false; empty.textContent = e.message;
      }
    }
    load();
  </script>
</body>
</html>
